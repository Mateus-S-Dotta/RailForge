services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: railforge_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/code/app
    networks:
      - railForge_network

networks:
  railForge_network:
    external: true